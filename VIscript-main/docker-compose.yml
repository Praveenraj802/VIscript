version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: visualiq-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - visualiq-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visualiq-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/tmp/uploads
      - ./frames:/tmp/frames
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped
    networks:
      - visualiq-network

  redis:
    image: redis:7-alpine
    container_name: visualiq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - visualiq-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: visualiq-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - visualiq-network

volumes:
  redis_data:
  chroma_data:

networks:
  visualiq-network:
    driver: bridge
